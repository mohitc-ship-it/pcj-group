services:
  - type: web
    name: techpack-pcj
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      # Set these in Render dashboard — never commit real keys
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Default model — override in dashboard if needed
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-6
      # RENDER_EXTERNAL_URL is injected automatically by Render (used as BASE_URL)
